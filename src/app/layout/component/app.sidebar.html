<aside
    class="layout-sidebar fixed inset-y-0 left-0 z-50 flex flex-col overflow-hidden bg-white dark:bg-gray-950 border-r border-slate-200 dark:border-slate-800"
    [class.is-collapsed]="isCollapsed" [class.mobile-open]="isMobileOpen">

    <!-- Logo (chiều cao = topbar để thẳng hàng) -->
    <div class="sidebar-brand flex items-center gap-3 px-5 h-24 shrink-0 border-b border-slate-200 dark:border-slate-800">
        <div
            class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 shrink-0">
            <i class="pi pi-bolt text-white text-xl"></i>
        </div>
        <div class="sidebar-brand-text min-w-0">
            <p class="text-lg font-extrabold tracking-tight text-slate-800 dark:text-white leading-tight">VAC</p>
            <p class="text-xs font-medium text-slate-400 truncate">Hệ thống quản lý</p>
        </div>
    </div>

    <!-- Điều hướng -->
    <nav class="flex-1 overflow-y-auto px-4 py-6">
        <ul class="space-y-2">
            @for (item of items; track item.routerLink) {
            <li>
                <a [routerLink]="item.routerLink" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
                    [title]="item.label"
                    class="sidebar-item flex items-center gap-3.5 px-4 py-3.5 rounded-2xl text-base font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/70 transition-all duration-200 cursor-pointer">
                    <i [ngClass]="item.icon" class="text-lg w-6 text-center shrink-0 text-slate-400"></i>
                    <span class="sidebar-label truncate">{{ item.label }}</span>
                </a>
            </li>
            }
        </ul>
    </nav>

    <!-- Chân sidebar -->
    <div class="px-5 py-4 border-t border-slate-200 dark:border-slate-800 shrink-0">
        <p class="sidebar-footer-text text-xs text-slate-400 dark:text-slate-500">VAC v1.0.0</p>
    </div>
</aside>
