<header
    class="layout-topbar flex items-center gap-4 px-4 sm:px-6 bg-white/90 dark:bg-gray-950/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800"
    [class.is-collapsed]="isCollapsed">

    <!-- Mở/đóng menu -->
    <button type="button" (click)="layoutService.onMenuToggle()" title="Thu gọn / mở menu"
        class="w-11 h-11 rounded-xl flex items-center justify-center text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all cursor-pointer shrink-0">
        <i class="pi pi-bars text-lg"></i>
    </button>

    <!-- Tiêu đề trang -->
    <div class="min-w-0">
        <p class="text-[11px] font-bold uppercase tracking-[0.18em] text-slate-400 dark:text-slate-500">
            {{ pageSection }}
        </p>
        <h1 class="text-lg sm:text-xl font-extrabold text-slate-800 dark:text-white tracking-tight truncate">
            {{ pageTitle }}
        </h1>
    </div>

    <div class="flex-1"></div>

    <!-- Tối / sáng -->
    <button type="button" (click)="layoutService.toggleDarkMode()"
        [title]="layoutService.isDarkTheme() ? 'Chế độ sáng' : 'Chế độ tối'"
        class="w-11 h-11 rounded-xl flex items-center justify-center text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all cursor-pointer shrink-0">
        <i class="pi text-lg" [ngClass]="layoutService.isDarkTheme() ? 'pi-sun' : 'pi-moon'"></i>
    </button>

    <!-- Tài khoản -->
    <button type="button" (click)="userMenu.toggle($event)"
        class="flex items-center gap-3 pl-2 pr-3 py-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-all cursor-pointer shrink-0">
        <span
            class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white font-bold text-sm flex items-center justify-center shadow-md shadow-indigo-500/30">
            QT
        </span>
        <span class="hidden md:block text-sm font-bold text-slate-800 dark:text-white">Quản trị viên</span>
        <i class="pi pi-angle-down text-sm text-slate-400 hidden md:block"></i>
    </button>

    <p-menu #userMenu [model]="userMenuItems" [popup]="true" styleClass="w-64" />
</header>
