<div class="space-y-6">

    <!-- Tiêu đề trang -->
    <div
        class="rounded-3xl bg-white dark:bg-gray-900 border border-slate-200/70 dark:border-slate-800 p-8 shadow-lg shadow-slate-200/50 dark:shadow-black/20">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-800 dark:text-white tracking-tight">
            {{ greeting }}, Quản trị viên! 👋
